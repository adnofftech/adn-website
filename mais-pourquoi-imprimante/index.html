      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js" } }

    <style>
      @font-face { font-family: "InterBold"; src: url("assets/Inter-Bold.otf"); font-weight: 700; }
      @font-face { font-family: "InterBlack"; src: url("assets/Inter-Black.otf"); font-weight: 900; }

      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #03060a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #03060a; font-family: "InterBold", sans-serif; }

      /* ---- 3D layer ---- */
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.65) 100%); }
      #flash { position: absolute; inset: 0; background: #eafff2; opacity: 0; pointer-events: none; }
      #dip { position: absolute; inset: 0; background: #03060a; opacity: 0; pointer-events: none; }

      /* ---- Kinetic titles ---- */
      .title { position: absolute; left: 60px; right: 60px; text-align: center; color: #f2fff7;
        font-family: "InterBlack", sans-serif; font-weight: 900; line-height: 1.02; letter-spacing: -0.02em;
        text-shadow: 0 6px 40px rgba(0,0,0,0.85); }
      .title .w { display: inline-block; margin: 0 14px; will-change: transform; }
      .gold { color: #f5c542; }
      .green { color: #2bf08a; }
      #t1 { top: 250px; font-size: 118px; }
      #t3 { top: 250px; font-size: 104px; }
      #t4 { top: 330px; font-size: 112px; }
      #t6a { top: 300px; font-size: 100px; }
      #t6b { top: 760px; font-size: 62px; }

      /* ---- Captions ---- */
      #caps { position: absolute; left: 70px; right: 70px; top: 1370px; height: 260px; display: flex; align-items: center; justify-content: center; text-align: center; }
      .cap { position: absolute; left: 0; right: 0; font-size: 56px; line-height: 1.14; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.9); }
      .cap b { color: #f5c542; font-weight: 700; }

      /* ---- Counter badge (S3) ---- */
      #price { position: absolute; left: 90px; right: 90px; top: 760px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
      #price .row { display: flex; align-items: baseline; gap: 22px; font-family: "InterBlack"; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.8); }
      #price .lbl { font-size: 46px; color: #9fe9c0; }
      #price .val { font-size: 128px; color: #f5c542; font-variant-numeric: tabular-nums; }
      #price .sub { font-size: 40px; color: #ff7d6e; }
      #stock { font-size: 44px; color: #cfe9dc; }

      /* ---- S5 diagram ---- */
      #diag { position: absolute; inset: 0; opacity: 0; }
      #diag svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .gridbg { position: absolute; inset: 0; background-image:
        linear-gradient(rgba(43,240,138,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(43,240,138,.07) 2px, transparent 2px);
        background-size: 90px 90px; }
      .dlabel { font-family: "InterBold"; fill: #e8fff2; font-size: 38px; }
      .dsub { font-family: "InterBold"; fill: #8fd9ae; font-size: 30px; }
      .dbig { font-family: "InterBlack"; fill: #f5c542; font-size: 52px; }

      /* ---- Closing card (S6) ---- */
      #cta { position: absolute; left: 80px; right: 80px; top: 360px; text-align: center; opacity: 0; font-family: "InterBlack"; font-size: 70px; color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.9); }
      #cta span { color: #f5c542; }
    </style>

    <script>
      // ===== Timing table: single source of truth (re-sync after the real voice-over is generated) =====
      window.TIMING = {
        S: [0, 10, 20, 38, 53, 72], END: 86, FREEZE: 41.8,
        // [start, end, text] — **bold** = gold keyword. Replace with word-aligned times from the real audio.
        PHRASES: [
          [0.6, 4.8, "Imaginez une machine qui imprime de **l'argent**… sans jamais s'arrêter."],
          [5.2, 9.4, "Alors pourquoi les États ne le font-ils pas, **à l'infini** ?"],

          [26.3, 33.9, "Quand l'argent à dépenser augmente bien plus vite que les biens et services, **les prix peuvent grimper**. C'est l'**inflation**."],

    <script>
      // ===================== DOM / 2D animation (GSAP, seek-safe) =====================
      const T = window.TIMING;
      const tl = gsap.timeline({ paused: true });
      const esc = (s) => s.replace(/&/g, "&amp;");

      // --- captions
      const caps = document.getElementById("caps");
      T.PHRASES.forEach(([a, b, txt], i) => {
        const el = document.createElement("div");
        el.className = "cap";
        el.id = "cap" + i;
        el.innerHTML = esc(txt).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
        el.style.opacity = 0;
        caps.appendChild(el);
        tl.fromTo(el, { opacity: 0, y: 26, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(1.6)" }, a);
        tl.to(el, { opacity: 0, y: -14, duration: 0.2, ease: "power1.in" }, Math.max(a + 0.3, b - 0.12));
      });

      // --- kinetic title builder
      function words(el, html, cls) {
        el.innerHTML = html.split(" ").map((w) => `<span class="w ${cls || ""}">${w}</span>`).join(" ");
        return el.querySelectorAll(".w");
      }
      function pop(ws, t, stagger = 0.11) {
        tl.fromTo(ws, { opacity: 0, y: 60, scale: 0.4, rotation: (i) => ((i * 37) % 17) - 8 },
          { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.42, stagger, ease: "back.out(2.2)" }, t);
      }

      // S1 title (on screen from second 0.9: captivates immediately)
      const w1 = words(document.getElementById("t1"), "ET SI ON IMPRIMAIT DE <span class='gold'>L'ARGENT</span> À <span class='green'>L'INFINI</span> ?");
      gsap.set(w1, { opacity: 0 });
      pop(w1, 0.9, 0.13);
      tl.to("#t1", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 9.4);

      // S3: supermarket
      tl.fromTo("#price", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5 }, 22.0);
      const price = { v: 1.2 };
      tl.to(price, { v: 9.4, duration: 14, ease: "power2.in", onUpdate: () => {
        const el = document.getElementById("pv"); if (el) el.textContent = price.v.toFixed(2).replace(".", ",") + " €";
      } }, 22.5);
      tl.to("#psub", { color: "#ff5b4a", duration: 3, onStart: () => {} }, 30);
      tl.to("#price", { opacity: 0, duration: 0.3 }, 33.5);
      const w3 = words(document.getElementById("t3"), "PLUS D'ARGENT <span class='gold'>≠</span> PLUS DE <span class='green'>RICHESSE</span>");
      gsap.set(w3, { opacity: 0 });
      pop(w3, 34.0, 0.14);
      tl.to("#t3", { opacity: 0, scale: 1.08, duration: 0.3, ease: "power2.in" }, 37.6);

      // S4: reveal — the title slams in after the freeze
      const w4 = words(document.getElementById("t4"), "L'ARGENT N'EST PAS LA <span class='gold'>RICHESSE</span>");
      gsap.set(w4, { opacity: 0 });
      tl.fromTo(w4, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.12, ease: "power4.out" }, 42.55);
      tl.fromTo("#t4", { x: 0 }, { keyframes: [{ x: -14, duration: 0.04 }, { x: 14, duration: 0.04 }, { x: -8, duration: 0.04 }, { x: 0, duration: 0.04 }], ease: "none" }, 43.1);
      tl.to("#t4", { opacity: 0, y: -30, duration: 0.4 }, 52.0);

      // S6: closing
      const w6 = words(document.getElementById("t6a"), "L'ARGENT <span class='gold'>CIRCULE</span>");
      gsap.set(w6, { opacity: 0 });
      pop(w6, 76.6, 0.18);
      const w6b = words(document.getElementById("t6b"), "LA RICHESSE <span class='green'>SE FABRIQUE</span>");
      gsap.set(w6b, { opacity: 0 });
      pop(w6b, 77.9, 0.16);
      tl.to(["#t6a", "#t6b"], { opacity: 0, duration: 0.4 }, 79.8);
      document.getElementById("cta").innerHTML = "QU'EST-CE QUI REND UN PAYS<br><span>VRAIMENT RICHE ?</span><div style='font-size:46px;color:#cfe9dc;margin-top:34px;font-family:InterBold'>Dis-le en commentaire</div>";
      tl.fromTo("#cta", { opacity: 0, scale: 0.85, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 80.1);

      // --- Transition flashes / dips (sync with sound design)
      const flash = (t, peak = 0.9, d = 0.18) => tl.fromTo("#flash", { opacity: 0 }, { opacity: peak, duration: d * 0.4, yoyo: true, repeat: 1, ease: "power2.out" }, t);
      flash(9.85, 0.55, 0.3);
      flash(19.93, 1.0, 0.16);   // brutal cut to the supermarket
      flash(37.9, 0.7, 0.2);
      tl.fromTo("#dip", { opacity: 0 }, { opacity: 1, duration: 0.2 }, FREEZE_BLACK());
      tl.to("#dip", { opacity: 0, duration: 0.01 }, FREEZE_BLACK() + 0.85);
      function FREEZE_BLACK() { return T.FREEZE - 0.02; }
      flash(71.7, 0.6, 0.3);

      // --- S5 diagram
      (function buildDiagram() {
        const svg = document.getElementById("diagsvg");
        const NS = "http://www.w3.org/2000/svg";
        const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };
        const G = (id) => mk("g", { id });
        const node = (id, x, y, label, sub, color) => {
          const g = G(id); g.setAttribute("opacity", 0);
          mk("rect", { x: x - 150, y: y - 70, width: 300, height: 140, rx: 28, fill: "#07140e", stroke: color, "stroke-width": 5 }, g);
          const l = mk("text", { x, y: y - 6, "text-anchor": "middle", class: "dlabel" }, g); l.textContent = label;
          const s = mk("text", { x, y: y + 40, "text-anchor": "middle", class: "dsub" }, g); s.textContent = sub;
          return g;
        };
        // Layout
        node("nCB", 540, 360, "BANQUE CENTRALE", "taux d'intérêt • billets", "#f5c542");
        node("nB1", 270, 760, "BANQUE A", "comptes & crédits", "#2bf08a");
        node("nB2", 810, 760, "BANQUE B", "comptes & crédits", "#2bf08a");
        node("nYou", 270, 1160, "VOUS", "compte : 0 €", "#9fe9c0");
        node("nShop", 810, 1160, "COMMERÇANT", "compte : 0 €", "#9fe9c0");
        node("nState", 540, 1560, "ÉTAT", "dépenses publiques", "#9fe9c0");
        // Edges
        const edge = (id, x1, y1, x2, y2, col) => { const p = mk("path", { id, d: `M${x1} ${y1} L${x2} ${y2}`, stroke: col || "#2bf08a", "stroke-width": 5, "stroke-dasharray": "14 12", fill: "none", opacity: 0 }); return p; };
        edge("eBB", 420, 760, 660, 760);
        edge("eYB", 270, 830, 270, 1090);
        edge("eSB", 810, 830, 810, 1090);
        edge("eYS", 420, 1160, 660, 1160, "#f5c542");
        edge("eCB1", 470, 430, 330, 690, "#f5c542");
        edge("eCB2", 610, 430, 750, 690, "#f5c542");
        edge("eCS", 540, 430, 540, 1490, "#ff5b4a");
        // Bar chart: banknotes vs bank deposits (schematic)
        const bars = G("bars"); bars.setAttribute("opacity", 0);
        mk("rect", { x: 130, y: 1700, width: 820, height: 140, rx: 20, fill: "#07140e", stroke: "#2bf08a", "stroke-width": 4 }, bars);
        mk("rect", { id: "barDep", x: 140, y: 1710, width: 0, height: 120, rx: 14, fill: "#2bf08a" }, bars);
        mk("rect", { id: "barCash", x: 140, y: 1710, width: 0, height: 120, rx: 14, fill: "#f5c542" }, bars);
        const bt1 = mk("text", { x: 540, y: 1690, "text-anchor": "middle", class: "dsub" }, bars); bt1.textContent = "schéma : monnaie bancaire (vert) vs billets (or)";
        // Loan creation
        const loan = G("loan"); loan.setAttribute("opacity", 0);
        const lt = mk("text", { x: 270, y: 1030, "text-anchor": "middle", class: "dbig" }, loan); lt.textContent = "+ 100 €";
        const lt2 = mk("text", { x: 270, y: 1295, "text-anchor": "middle", class: "dsub" }, loan); lt2.textContent = "crédit = monnaie créée";
        // Forbidden marker
        const ban = G("ban"); ban.setAttribute("opacity", 0);
        mk("circle", { cx: 540, cy: 960, r: 70, fill: "#190606", stroke: "#ff5b4a", "stroke-width": 9 }, ban);
        mk("path", { d: "M490 910 L590 1010", stroke: "#ff5b4a", "stroke-width": 9 }, ban);
        const bn = mk("text", { x: 540, y: 1075, "text-anchor": "middle", class: "dsub", fill: "#ff9b8f" }, ban); bn.textContent = "financement direct interdit";
        bn.setAttribute("style", "fill:#ff9b8f");
        // Coins (particles) travelling along the edges
        const coins = [];
        const coin = (id) => { const c = mk("circle", { id, r: 18, fill: "#f5c542", opacity: 0 }); coins.push(c); return c; };
        for (let i = 0; i < 8; i++) coin("coinA" + i);
        // Rate dial
        const dial = G("dial"); dial.setAttribute("opacity", 0);
        mk("circle", { cx: 540, cy: 560, r: 62, fill: "none", stroke: "#f5c542", "stroke-width": 6 }, dial);
        mk("path", { id: "needle", d: "M540 560 L540 510", stroke: "#f5c542", "stroke-width": 8, "stroke-linecap": "round" }, dial);
        const dt = mk("text", { x: 540, y: 660, "text-anchor": "middle", class: "dsub" }, dial); dt.textContent = "taux d'intérêt";

        // ---- timeline (S5 = 53 → 72)
        tl.to("#diag", { opacity: 1, duration: 0.5 }, 52.5);
        tl.to("#diag", { opacity: 0, duration: 0.5 }, 71.5);
        const nodeIn = (id, t) => tl.fromTo("#" + id, { opacity: 0, scale: 0.7, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, t);
        nodeIn("nYou", 53.9); nodeIn("nShop", 54.4); nodeIn("nB1", 55.0); nodeIn("nB2", 55.5);
        ["eYB", "eSB", "eBB"].forEach((id, i) => tl.to("#" + id, { opacity: 0.9, duration: 0.3 }, 55.6 + i * 0.2));
        tl.to("#eYS", { opacity: 0.9, duration: 0.3 }, 56.2);
        // payments: coins move You → Shop (electronic payment)
        for (let i = 0; i < 6; i++) {
          const c = "#coinA" + i, t0 = 56.5 + i * 0.32;
          tl.fromTo(c, { attr: { cx: 420, cy: 1160 }, opacity: 0 }, { attr: { cx: 660, cy: 1160 }, opacity: 1, duration: 0.5, ease: "power1.inOut" }, t0);
          tl.to(c, { opacity: 0, duration: 0.1 }, t0 + 0.5);
        }
        // bars: money mostly lives in bank accounts
        tl.to("#bars", { opacity: 1, duration: 0.4 }, 57.0);
        tl.to("#barDep", { attr: { width: 680 }, duration: 1.0, ease: "power2.out" }, 57.4);
        tl.to("#barCash", { attr: { x: 820, width: 120 }, duration: 0.6, ease: "power2.out" }, 58.0);
        // loan: bank A creates money on VOUS's account
        tl.to("#loan", { opacity: 1, duration: 0.2 }, 59.8);
        tl.fromTo("#loan", { y: 40 }, { y: 0, duration: 0.5, ease: "back.out(2)" }, 59.8);
        tl.to("#eYB", { stroke: "#f5c542", duration: 0.3 }, 60.0);
        tl.to("#nYou rect", { stroke: "#f5c542", duration: 0.2 }, 60.2);
        tl.to("#loan", { opacity: 0, duration: 0.4 }, 63.4);
        tl.to("#bars", { opacity: 0, duration: 0.4 }, 63.4);
        // central bank + dial
        nodeIn("nCB", 64.0);
        tl.to("#dial", { opacity: 1, duration: 0.3 }, 64.4);
        tl.fromTo("#needle", { rotation: -60, transformOrigin: "540px 560px" }, { rotation: 55, duration: 1.4, ease: "power2.inOut" }, 64.6);
        tl.to(["#eCB1", "#eCB2"], { opacity: 0.9, duration: 0.3 }, 65.0);
        // forbidden direct link to the State
        nodeIn("nState", 67.9);
        tl.to("#eCS", { opacity: 1, duration: 0.3 }, 68.3);
        tl.fromTo("#ban", { opacity: 0, scale: 0.4, transformOrigin: "540px 960px" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 68.8);
      })();

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>

    <script type="module">
      import * as THREE from "three";
      const T = window.TIMING;
      const [S1, S2, S3, S4, S5, S6] = T.S, FREEZE = T.FREEZE;
      const W = 1080, H = 1920;

      // ---------- deterministic RNG ----------
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = mulberry32(20240607);
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
      const lerp = (a, b, t) => a + (b - a) * t;
      const eio = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

      // ---------- renderer / scene ----------
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: false });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x03060a);
      scene.fog = new THREE.Fog(0x03060a, 28, 190);
      const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 600);

      // ---------- palette ----------
      const GREEN = 0x19c37d, NEON = 0x2bf08a, GOLD = 0xd4af37, BLACK = 0x07090b;

      // ---------- procedural textures (canvas) ----------
      function billTexture() {
        const c = document.createElement("canvas"); c.width = 512; c.height = 240;
        const g = c.getContext("2d");
        const gr = g.createLinearGradient(0, 0, 512, 240); gr.addColorStop(0, "#1f8f5a"); gr.addColorStop(0.5, "#37c981"); gr.addColorStop(1, "#177a4b");
        g.fillStyle = gr; g.fillRect(0, 0, 512, 240);
        g.strokeStyle = "#e9d27a"; g.lineWidth = 8; g.strokeRect(14, 14, 484, 212);
        g.strokeStyle = "rgba(233,210,122,.55)"; g.lineWidth = 2;
        for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(256, 120, 38 + i * 9, 0, Math.PI * 2); g.stroke(); }

        // S3 (supermarket) — cut at 20
        [20.0, [SX, 3.2, 17], [SX, 2.0, 0], 52],
        [27.0, [SX + 5, 2.6, 8], [SX, 2.0, 3], 62],
        [32.0, [SX - 4, 2.8, 12], [SX, 1.8, 4], 58],
        [37.9, [SX, 2.4, 14], [SX, 1.6, 6], 50],
        // S4 — back at the printer
        [38.0, [0, 3.0, 11], [0, 2.0, -3], 52],
        [41.7, [0, 2.8, 9.5], [0, 2.4, -3], 46],
        [41.9, [0, 2.8, 9.5], [0, 2.4, -3], 46],
        [43.0, [0, 3.5, 12], [0, 3.0, -2], 52],
        [47.5, [0, 9.5, 27], [0, 4.0, -2], 54],
        [52.5, [0, 15, 40], [0, 4.0, -3], 56],
        // S6
        [71.5, [0, 2.6, 9.5], [0, 1.6, -1.5], 50],
        [74.2, [0.8, 2.2, 7.2], [0.6, 0.8, 2.2], 48],
        [77.0, [0, 6.5, 14], [0, 5.0, -20], 56],
        [80.0, [0, 24, 22], [0, 10, -70], 58],
        [86.0, [0, 58, 34], [0, 12, -110], 62],
      ];
      const seg = (t) => { for (let i = K.length - 1; i >= 0; i--) if (t >= K[i][0]) return i; return 0; };
      const v3 = new THREE.Vector3();
      function rig(t) {
        const i = seg(t), a = K[i], b = K[Math.min(i + 1, K.length - 1)];
        let u = b[0] === a[0] ? 0 : clamp((t - a[0]) / (b[0] - a[0]));
        u = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; // ease in/out
        // the S2→S3, S3→S4 cuts are hard: keyframes at 19.9 / 20.0 and 37.9 / 38.0 are 0.1 s apart
        camera.position.set(lerp(a[1][0], b[1][0], u), lerp(a[1][1], b[1][1], u), lerp(a[1][2], b[1][2], u));
        v3.set(lerp(a[2][0], b[2][0], u), lerp(a[2][1], b[2][1], u), lerp(a[2][2], b[2][2], u));
        camera.fov = lerp(a[3], b[3], u); camera.updateProjectionMatrix();
        // handheld micro-shake, stronger as the machine accelerates (stops at the freeze)
        const live = t < FREEZE ? 1 : 0;
        const sh = live * (0.01 + 0.03 * clamp((t - 1) / 40)) * (t > S4 && t < FREEZE ? 2.5 : 1);
        camera.position.x += Math.sin(t * 31.7) * sh; camera.position.y += Math.sin(t * 27.3 + 1) * sh;
        camera.lookAt(v3);
      }

      // =====================================================================================
      //   Per-frame update
      // =====================================================================================
      const moneyFmt = (n) => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      function drawDisplay(t) {
        const g = dispG; g.fillStyle = "#020a06"; g.fillRect(0, 0, 512, 160);
        g.strokeStyle = "#2bf08a"; g.lineWidth = 4; g.strokeRect(6, 6, 500, 148);
        g.textAlign = "center"; g.textBaseline = "middle";
        if (t >= FREEZE && t < S6) { g.fillStyle = "#ff5b4a"; g.font = "bold 74px sans-serif"; g.fillText("STOP", 256, 84); }
        else {
          const v = 1000 * Math.pow(10, Math.min(t, FREEZE) * 0.34);
          g.fillStyle = "#2bf08a"; g.font = "bold 50px monospace"; g.fillText(moneyFmt(v) + " €", 256, 84);
        }
        dispTex.needsUpdate = true;
      }
      function drawTag(m, t) {
        const { g, c, tex, base, name } = m.userData;
        const u = clamp((t - (S3 + 3)) / 17);
        const k = 1 + 6.5 * u * u * (1 + 0.25 * Math.sin(t * 9 + base));
        const p = base * k;
        g.fillStyle = u > 0.4 ? "#ffefef" : "#fff"; g.fillRect(0, 0, 256, 128);
        g.fillStyle = u > 0.4 ? "#c8202c" : "#111"; g.font = "bold 30px sans-serif"; g.textAlign = "left"; g.fillText(name, 14, 34);
        g.font = "bold 66px sans-serif"; g.textAlign = "center"; g.fillText(p.toFixed(2).replace(".", ","), 128, 92);
        g.font = "bold 28px sans-serif"; g.fillText("€", 226, 100);
        tex.needsUpdate = true;
      }

      let lastDraw = -1;
      function renderAt(t) {
        // --- visibility of whole worlds
        const inShop = t >= S3 && t < S4;
        room.visible = !inShop; city.visible = t >= S6 - 0.5 || t < 0; shop.visible = inShop;
        scene.fog.near = inShop ? 40 : 28;
        scene.background.set(inShop ? 0x16201c : 0x03060a); scene.fog.color.set(inShop ? 0x16201c : 0x03060a);
        const hidden = t >= S5 + 0.7 && t < S6 - 0.5;     // diagram: no need to draw 3D
        canvas.style.opacity = hidden ? 0 : 1;
        if (hidden) return;

        // --- lights
        const on = sstep(0.6, 1.4, t) * (t < 0.9 ? 1 : 0.88 + 0.12 * Math.sin(t * 40) * (t < 1.8 ? 1 : 0));
        key.intensity = 1900 * on * (t >= FREEZE && t < S6 ? 0.6 : 1);
        rim.intensity = 520 * on; slotLight.intensity = 120 * on * (t < FREEZE ? 1 : 0.2); goldLight.intensity = 260 * on;

        // --- printer pose
        const spd = t < FREEZE ? 0.8 + 0.1 * Math.min(t, FREEZE) : 0;
        const rev = t < FREEZE ? 0.8 * t + 0.05 * t * t : 0.8 * FREEZE + 0.05 * FREEZE * FREEZE;
        rollers.forEach((r) => { r.rotation.y = rev * 6.28 * r.userData.dir; });
        lamps.forEach((l, i) => { l.material.color.set(t >= FREEZE && t < S6 ? 0xff3b30 : (i % 2 ? GOLD : NEON)); l.scale.setScalar(t < FREEZE ? 1 + 0.4 * Math.sin(t * 18 + i * 1.3) * on : 1); });
        const pscale = t < S4 + 12.4 ? 1 : (t < S5 - 2.4 ? 1 : 0);
        let ps = 1;
        if (t >= S5 - 2.4 && t < S6 - 0.5) ps = Math.max(0.0001, 1 - sstep(S5 - 2.4, S5 - 0.4, t));    // machine disappears
        else if (t >= S6 - 0.5) ps = 0.0001 + 1 * (1 - Math.pow(1 - sstep(S6 - 0.5, S6 + 0.5, t), 3)) * (1 + 0.08 * Math.sin(sstep(S6 - 0.5, S6 + 0.5, t) * 9));
        printer.scale.setScalar(ps); printer.rotation.y = t >= S5 - 2.4 && t < S6 - 0.5 ? sstep(S5 - 2.4, S5 - 0.4, t) * 6.28 : 0;
        if (t >= FREEZE && t < FREEZE + 0.5) printer.position.x = Math.sin(t * 90) * 0.06 * (1 - (t - FREEZE) / 0.5); else printer.position.x = 0;
        if (Math.abs(t - lastDraw) > 0.03) { drawDisplay(t); lastDraw = t; }

        // --- sheets: tray -> rollers -> slot (white -> green)
        const run = t > 0.9 && t < FREEZE ? 1 : 0;
        const cyc = t * (2.4 + 0.1 * Math.min(t, FREEZE));
        for (let j = 0; j < SHEETS; j++) {
          const s = ((cyc + j / SHEETS * 6) % 1);
          const e = s;
          // path: from (0,4.9,-0.6) down behind the front to the slot (0,1.05,2.0)
          const y = lerp(4.9, 1.05, e), z = lerp(-0.8, 1.9, sstep(0.15, 0.95, e)), x = 0;
          dummy.position.set(x, y, z); dummy.rotation.set(-Math.PI / 2 + (1 - e) * 1.2 + 1.2 * e, 0, 0);
          const vis = run && (j < SHEETS * (0.4 + 0.6 * clamp(t / 6)));
          dummy.scale.setScalar(vis ? 1 : 0.0001); dummy.updateMatrix(); sheets.setMatrixAt(j, dummy.matrix);
          const gcol = sstep(0.45, 0.8, e);
          sheets.setColorAt(j, new THREE.Color(lerp(1, 0.18, gcol), lerp(1, 0.85, gcol), lerp(1, 0.5, gcol)));
        }
        sheets.instanceMatrix.needsUpdate = true; if (sheets.instanceColor) sheets.instanceColor.needsUpdate = true;

        // --- bills
        let tc;
        if (t < FREEZE) tc = t; else if (t < S6 - 0.5) tc = FREEZE; else tc = FREEZE + (t - (S6 - 0.5)) * 0.8;   // frozen from the cut until S6 resumes the fall
        for (let i = 0; i < NB; i++) {
          const b = bd[i];
          const u = (tc - b.ts) / b.dur;
          if (u <= 0) { dummy.scale.setScalar(0.0001); dummy.position.set(0, -10, 0); dummy.updateMatrix(); bills.setMatrixAt(i, dummy.matrix); continue; }
          const q = clamp(u);
          const ez = 1 - Math.pow(1 - q, 2.2);
          const px = lerp(b.sx * 0.15, b.x, ez), pz = lerp(slotWorld.z + 0.4, b.z, ez);
          let py = lerp(slotWorld.y, b.y, q * q * (3 - 2 * q) * 0.0 + q) + Math.sin(q * Math.PI) * b.arc * (b.late ? 1 : 0.9) * (q < 1 ? 1 : 0);
          if (q >= 1) py = b.y;
          dummy.position.set(px, py, pz);
          const settle = q >= 1 ? 0 : (1 - q);
          dummy.rotation.set(-Math.PI / 2 + b.tilt * q + settle * b.spin * 0.6, b.yaw * q + settle * b.spin * 0.3, settle * b.spin * 0.2);
          dummy.scale.setScalar(1 + (b.late ? 0.2 : 0)); dummy.updateMatrix(); bills.setMatrixAt(i, dummy.matrix);
        }
        bills.instanceMatrix.needsUpdate = true;

        // hero bill (final bill falls slowly)
        const hu = (t - (S6 + 0.6)) / 3.4;
        hero.visible = hu > 0 && t < S6 + 9;
        if (hero.visible) {
          const q = clamp(hu); const e = 1 - Math.pow(1 - q, 1.6);
          hero.position.set(lerp(0, 0.7, e) + Math.sin(q * 9) * 0.35 * (1 - q), lerp(1.05, 0.12, e), lerp(-0.6, 2.6, e) + Math.cos(q * 7) * 0.2 * (1 - q));
          hero.rotation.set(-Math.PI / 2 + Math.sin(q * 8) * 0.5 * (1 - q), q * 3.2, Math.sin(q * 6) * 0.3 * (1 - q));
        }

        // --- wealth items (S4 reveal)
        wealth.visible = t >= S4 + 6 && t < S5 + 1;
        wealthItems.forEach((it, i) => {
          const u = clamp((t - it.userData.t0) / 0.6); const s = u === 0 ? 0.0001 : (1 + 0.25 * Math.sin(u * Math.PI)) * 1.9 * u;
          it.scale.setScalar(Math.max(s, 0.0001));
          it.rotation.y = (t - it.userData.t0) * 0.9; it.position.y = 4.5 + (i % 2) * 1.4 + Math.sin(t * 1.6 + i) * 0.3;
          if (it.userData.spin) it.rotation.z = t * 1.2;
        });

        // --- supermarket
        if (inShop) {
          for (let i = 0; i < pinfo.length; i++) {
            const p = pinfo[i]; const gone = t > p.gone;
            dummy.position.set(p.x, p.y + (gone ? Math.min(0.0, 0) : 0), p.z); dummy.rotation.set(0, 0, 0);
            const sc = gone ? Math.max(0.0001, 1 - (t - p.gone) * 4) : 1; dummy.scale.setScalar(sc); dummy.updateMatrix(); prods.setMatrixAt(i, dummy.matrix);
          }
          for (let i = pinfo.length; i < PRODN; i++) { dummy.scale.setScalar(0.0001); dummy.updateMatrix(); prods.setMatrixAt(i, dummy.matrix); }
          prods.count = PRODN; prods.instanceMatrix.needsUpdate = true;
          if (Math.abs(t - (window.__lt || -9)) > 0.05) { tags.forEach((m) => drawTag(m, t)); window.__lt = t; }
          custs.forEach((c, i) => {
            const u = clamp((t - S3) / 18); const lane = [-6, -2, 3, 7][i];
            const walk = (t * 1.1 + c.userData.ph);
            c.position.set(Math.sin(walk * 0.5 + i) * 7, 0, [ -5, 1, 7, 13 ][i] - 1.2);
            c.rotation.y = Math.cos(walk * 0.5 + i) > 0 ? Math.PI / 2 : -Math.PI / 2;
            c.children[0].position.y = 1.15 + Math.abs(Math.sin(walk * 5)) * 0.1;
            const sc = 0.4 + 3.6 * u * u; c.userData.stack.scale.set(1, sc, 1); c.userData.stack.position.y = 1.4 + sc * 0.5 - 0.5;
          });
        }

        // --- city
        if (city.visible) {
          const tt = t;
          for (let i = 0; i < NV; i++) { const v = vd[i]; const x = ((v.x0 + tt * v.spd) % 260 + 260) % 260 - 130; dummy.position.set(x, 0.7, v.z); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(1); dummy.updateMatrix(); veh.setMatrixAt(i, dummy.matrix); }
          veh.instanceMatrix.needsUpdate = true;
          for (let i = 0; i < NP; i++) { const p = pd[i]; dummy.position.set(p.x + Math.sin(tt * 0.8 + p.ph) * 1.4, 0.5 + Math.abs(Math.sin(tt * 4 + p.ph)) * 0.2, p.z); dummy.scale.setScalar(1); dummy.updateMatrix(); ppl.setMatrixAt(i, dummy.matrix); }
          ppl.instanceMatrix.needsUpdate = true;
          chim.forEach((c, i) => { c.scale.setScalar(1 + 0.25 * Math.sin(tt * 3 + i)); });
        }

        rig(t);
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["scene"] = Promise.resolve().then(() => { renderAt(window.__hfThreeTime || 0); });
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
