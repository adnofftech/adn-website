<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Devis974 — publicité « La grille » (124 BPM)</title>
<style>
@font-face{font-family:Serif;src:url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-style:italic}
@font-face{font-family:Mono;src:url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:Mono;src:url(assets/fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2");font-weight:600}
:root{--navy:#10243A;--blue:#2563EB;--paper:#F4F7FB;--ink:#10243A;--orange:#EA7A1A;--green:#16A34A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden;background:var(--navy)}
.abs{position:absolute}
.L{position:absolute;inset:0}
#paper div{position:absolute;left:0;right:0;background:var(--paper)}
.cell{position:absolute;overflow:hidden;background:#0b1a2b}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.strip{position:absolute;overflow:hidden}
.strip img{position:absolute;object-fit:cover}
.hl{position:absolute;font-weight:800;letter-spacing:-.035em;line-height:1.02}
.hl .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .12em 0;margin-bottom:-.12em}
.hl .w>span{display:inline-block}
.hl .acc{font-family:Serif;font-style:italic;font-weight:400;letter-spacing:-.01em}
.lab{position:absolute;font-family:Mono;font-weight:600;font-size:22px;letter-spacing:.04em;text-transform:none}
.cap{position:absolute;font-family:Mono;font-size:18px;letter-spacing:.02em}
.num{position:absolute;font-weight:800;letter-spacing:-.06em;line-height:.8;color:var(--orange)}
.numlab{position:absolute;font-family:Mono;font-size:22px;color:var(--orange)}
.dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--orange)}
.nt{position:absolute;width:400px;background:rgba(244,247,251,.96);color:var(--ink);border-radius:20px;padding:15px 17px;display:flex;gap:13px;box-shadow:0 24px 50px rgba(3,10,22,.35)}
.nt .ic{flex:none;width:44px;height:44px;border-radius:11px}
.nt small{display:block;font-family:Mono;font-size:14px;color:#5B6B7F}.nt b{display:block;font-size:19px}.nt p{font-size:18px;color:#2c3e55}
.dev{position:absolute}
.phone{background:#0b0f16;border-radius:58px;padding:12px;box-shadow:0 50px 100px rgba(16,36,58,.35),0 0 0 2px #2b3442 inset}

.browser{background:#fff;border-radius:14px;box-shadow:0 40px 90px rgba(16,36,58,.28),0 0 0 1px rgba(16,36,58,.12);overflow:hidden}
.browser .bar{height:40px;background:#E9EEF5;display:flex;align-items:center;gap:8px;padding:0 16px}
.browser .bar i{width:12px;height:12px;border-radius:50%;background:#c9d2de}
.browser .bar span{margin-left:16px;flex:1;height:24px;border-radius:7px;background:#fff;font-family:Mono;font-size:13px;color:#5B6B7F;display:flex;align-items:center;padding-left:12px}
.browser .scr{position:relative;overflow:hidden;background:#fff}
.scr img{position:absolute;left:0;top:0;transform-origin:0 0}
.chip{position:absolute;display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;color:var(--ink);font-weight:700;font-size:27px;border:2px solid var(--ink);white-space:nowrap}
.chip i{width:14px;height:14px;background:var(--blue)}.chip.orange i{background:var(--orange)}.chip.green i{background:var(--green)}
#site{position:absolute;overflow:hidden;border-radius:10px;box-shadow:0 40px 90px rgba(3,10,22,.35)}
#site img{position:absolute;transform-origin:0 0}
#pdf{position:absolute;background:#fff;box-shadow:0 50px 110px rgba(16,36,58,.35)}
#pdf img{width:100%;height:100%;display:block}
#check{position:absolute;border-radius:50%;background:var(--green);display:grid;place-items:center}
#row{position:absolute;left:0;overflow:hidden}
#row .fill{position:absolute;inset:0;background:var(--orange);transform-origin:0 50%}
#row .txt{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;font-family:Mono;font-weight:600;color:#fff;white-space:nowrap}
#brow{position:absolute;left:0;overflow:hidden}#brow .fill{position:absolute;inset:0;background:var(--blue);transform-origin:0 50%}
.logo{position:absolute;display:flex;align-items:center}
.mark{background:var(--blue);display:grid;place-items:center}
.wm{font-weight:800;letter-spacing:-.045em;color:#fff;line-height:1}.wm span{color:#9CC3FF}
#ctaBtn{position:absolute;background:var(--blue);color:#fff;font-weight:800;display:flex;align-items:center;gap:16px;overflow:hidden}
#tap{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid var(--blue);background:rgba(37,99,235,.18);z-index:60}
#iris{position:absolute;inset:0;z-index:55}
#flash{position:absolute;inset:0;background:#fff;z-index:70}
</style>
</head>
<body>
<div id="stage">
  <div class="L" id="bgNavy" style="background:var(--navy)"></div>

    <div class="L" id="cells"></div>

    <div id="dev" class="dev"></div>
    <div id="pdf"><img id="pdfImg" alt=""><div id="check"><svg viewBox="0 0 100 100" width="62%" height="62%"><path id="ckp" d="M24 52 L43 70 L78 32" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div></div>

    <div class="logo" id="logo"><div class="mark" id="mark"><svg viewBox="0 0 74 74" width="58%" height="58%"><rect x="15" y="8" width="44" height="58" rx="5" fill="none" stroke="#fff" stroke-width="6"/><path d="M25 39 L34 48 L50 30" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="wm" id="wm">Devis<span>974</span></div></div>
    <div id="chips" class="L"></div>
  </div>
  <div class="L" id="txt"></div>
  <div id="iris"></div>
  <div id="flash"></div>
</div>
<script>
// ======================= moteur seek(t) déterministe (claude-motion-design) =======================
const QS = new URLSearchParams(location.search);
const FMT = QS.get('f') === 'h' ? 'h' : 'v';
const W = FMT === 'h' ? 1920 : 1080, H = FMT === 'h' ? 1080 : 1920, M = FMT === 'h' ? 80 : 90;
const MODE = FMT === 'h' ? 'desktop' : 'mobile';
const stage = document.getElementById('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const io = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const out3 = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const o5 = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 5);
const in3 = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x;
const steps = (x, n) => Math.floor(clamp(x) * n + 1e-6) / n;              // « module snap »
function spring(t, k = 170, d = 26) { if (t <= 0) return 0; const w = Math.sqrt(k), z = d / (2 * w);
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + z * w / wd * Math.sin(wd * t)); } return 1 - Math.exp(-w * t) * (1 + w * t); }
const UI = (t, t0) => spring(t - t0, 320, 30), BX = (t, t0) => spring(t - t0, 220, 24), HV = (t, t0) => spring(t - t0, 130, 25);
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const op = (el, o) => { el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'inherit'; };
const box = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
const pending = [];
const HALF = 1 / 60; // une coupe franche tombe sur l'image la plus proche du temps musical
function setSrc(img, url) { if (img.dataset.u !== url) { img.dataset.u = url; img.src = url; pending.push(img.decode().catch(() => {})); } }

let TL, BT, CAPS, FOOT;
// temps musical → secondes (interpolé, prolongé au-delà du dernier temps)
function B(x) { const n = BT.length; if (x <= 0) return BT[0] + x * (BT[1] - BT[0]); if (x >= n - 1) return BT[n - 1] + (x - n + 1) * 0.48387;
  const i = Math.floor(x), f = x - i; return BT[i] + f * (BT[i + 1] - BT[i]); }

// ======================= mise en page par format =======================
const LV = {
  head: { x: 90, y: 196, w: 920, size: 84 }, label: { x: 90, y: 138 }, cell: { x: 0, y: 540, w: 1080, h: 1080 },
  phone: { cx: 540, cy: 1040, sw: 500 }, site: { x: 45, y: 840, w: 990 }, pdf: { cx: 560, cy: 1040, h: 880 },
  num: { x: 64, y: 1150, size: 400 }, cap: { x: 90, y: 1622 }, row: { y: 900, h: 90, size: 30 }, brow: { y: 810, h: 90 },
  logoReveal: { x: 90, y: 810, mark: 90, size: 96 }, sub: { x: 90, y: 950, size: 46 },
  chips: [[660, 620], [660, 770], [660, 920], [620, 1200], [620, 1350], [620, 1200], [620, 1350], [630, 1200], [630, 1350]],
  burst: { x: 0, y: 540, w: 1080, h: 1080 }, cta: { x: 90, y: 600, mark: 120, size: 120, sloY: 820, sloSize: 80, btnY: 1110, soonY: 1250, credY: 1660 },
  notes: [[40, 640], [40, 790], [40, 940], [40, 1090]], numLab: { x: 72, y: 1500 },
  cellsP5: { a: [360, 540, 720, 1080], b: [0, 540, 360, 540] }, numP5: { x: 30, y: 1120, size: 300 },
};
const LH = {
  head: { x: 1120, y: 190, w: 740, size: 76 }, label: { x: 1120, y: 128 }, cell: { x: 80, y: 80, w: 960, h: 920 },
  browser: { x: 56, y: 170, w: 1040, h: 720 }, site: { x: 80, y: 300, w: 960 }, pdf: { cx: 560, cy: 540, h: 900 },
  num: { x: 1110, y: 620, size: 340 }, cap: { x: 80, y: 1028 }, row: { y: 480, h: 80, size: 28 }, brow: { y: 400, h: 80 },
  logoReveal: { x: 160, y: 400, mark: 80, size: 88 }, sub: { x: 160, y: 520, size: 44 },
  chips: [[1120, 640], [1120, 730], [1120, 820], [1120, 640], [1120, 730], [1120, 820], [1120, 640], [1120, 730], [1120, 820]],
  burst: { x: 0, y: 0, w: 1040, h: 1080 }, cta: { x: 160, y: 240, mark: 110, size: 110, sloY: 420, sloSize: 78, btnY: 650, soonY: 780, credY: 1020 },
  notes: [[700, 120], [700, 260], [700, 400], [700, 540]], numLab: { x: 1120, y: 960 },
  cellsP5: { a: [80, 80, 520, 920], b: [600, 80, 440, 460] }, numP5: { x: 1110, y: 620, size: 340 },
};
const L = FMT === 'h' ? LH : LV;
// cadrage des plans filmés (object-position) par format
const FOCUS = { v: { electricien: '42% 40%', plombier: '38% 50%', marteau: '50% 60%', telephone: '68% 40%', paperasse: '50% 55%', pile: '45% 50%', jardinier: '55% 50%', plomberie: '62% 50%', nettoyage: '62% 40%', enduit: '55% 35%' },
                h: { electricien: '45% 35%', plombier: '40% 50%', marteau: '50% 70%', telephone: '70% 35%', paperasse: '50% 45%', pile: '50% 50%', jardinier: '50% 50%', plomberie: '60% 50%', nettoyage: '60% 45%', enduit: '50% 30%' } }[FMT];
const fr = (name, i) => `assets/footage/${name}/${String(Math.max(1, Math.min(FOOT[name].frames, i))).padStart(4, '0')}.jpg`;

// ======================= construction =======================
const els = {};
function mkHead(h, i) {
  const el = document.createElement('div'); el.className = 'hl';
  let inAcc = false; const words = [];
  for (const word of h.text.split(' ').filter(Boolean)) { let inner = '', buf = '';
    const flush = () => { if (buf) inner += inAcc ? `<span class="acc">${buf}</span>` : buf; buf = ''; };
    for (const ch of word) { if (ch === '*') { flush(); inAcc = !inAcc; } else buf += ch; } flush();
    words.push(`<span class="w"><span>${inner}</span></span>`); }
  el.innerHTML = words.join(' ');
  const lineOff = (h.line || 0) * L.head.size * 1.05;
  Object.assign(el.style, { left: L.head.x + 'px', top: (L.head.y + lineOff) + 'px', width: L.head.w + 'px', fontSize: L.head.size + 'px' });
  $('txt').append(el); return { el, ws: [...el.querySelectorAll('.w>span')], accs: [...el.querySelectorAll('.acc')], h };
}
function build() {
  // grille
  const g = $('grid'); g.setAttribute('width', W); g.setAttribute('height', H); els.lines = [];
  for (let x = M; x < W; x += M) { const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); l.setAttribute('x1', x); l.setAttribute('x2', x); l.setAttribute('y1', 0); l.setAttribute('y2', H); g.append(l); els.lines.push([l, 'v', x]); }
  for (let y = M; y < H; y += M) { const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); l.setAttribute('y1', y); l.setAttribute('y2', y); l.setAttribute('x1', 0); l.setAttribute('x2', W); g.append(l); els.lines.push([l, 'h', y]); }
  els.lines.forEach(([l]) => { l.setAttribute('stroke-width', 1); l.setAttribute('pathLength', 1); l.setAttribute('stroke-dasharray', 1); });
  // fond papier par rangées de modules
  els.paperRows = []; for (let y = 0; y < H; y += M) { const d = document.createElement('div'); d.style.top = y + 'px'; d.style.height = (M + 1) + 'px'; $('paper').append(d); els.paperRows.push(d); }
  // cellules vidéo
  els.cA = mkCell(); els.cB = mkCell(); els.cC = mkCell();
  els.strips = [0, 1, 2].map(() => { const d = document.createElement('div'); d.className = 'strip'; const im = document.createElement('img'); d.append(im); $('cells').append(d); return { d, im }; });
  // pastilles orange (comptées par le grand chiffre)
  const r = rng(974); els.dots = [];
  const area = L.cell; for (let i = 0; i < 12; i++) { const d = document.createElement('div'); d.className = 'dot';
    const cx = Math.round((area.x + M + r() * (area.w - 2 * M)) / M) * M, cy = Math.round((area.y + M + r() * (area.h - 3 * M)) / M) * M;
    d.style.left = cx + 'px'; d.style.top = cy + 'px'; $('dots').append(d); els.dots.push(d); }
  els.num = document.createElement('div'); els.num.className = 'num'; $('world').append(els.num);
  els.numLab = document.createElement('div'); els.numLab.className = 'numlab'; els.numLab.textContent = 'demandes en attente'; $('world').append(els.numLab);
  // notifications
  els.notes = TL.notifications.map((n, i) => { const d = document.createElement('div'); d.className = 'nt';
    d.innerHTML = `<div class="ic" style="background:${n.color}"></div><div><small>${n.app} · maintenant</small><b>${n.title}</b><p>${n.text}</p></div>`;
    d.style.left = L.notes[i][0] + 'px'; d.style.top = L.notes[i][1] + 'px'; $('notes').append(d); return d; });
  // appareil : téléphone (9:16) ou navigateur (16:9) contenant les vraies captures
  const dev = $('dev');
  if (FMT === 'v') { const sw = L.phone.sw, sh = Math.round(sw * 844 / 390); dev.className = 'dev phone'; dev.innerHTML = `<div class="scr" style="width:${sw}px;height:${sh}px"><img id="scrA"><img id="scrB"></div><div id="tap"></div>`;
    els.devW = sw + 24; els.devH = sh + 24; els.scrW = sw; els.scrH = sh; els.cssW = 390; els.scrOff = [12, 12]; }
  else { const b = L.browser; dev.className = 'dev browser'; dev.innerHTML = `<div class="bar"><i></i><i></i><i></i><span>Devis974 — mon espace</span></div><div class="scr" style="width:${b.w}px;height:${b.h}px"><img id="scrA"><img id="scrB"></div><div id="tap"></div>`;
    els.devW = b.w; els.devH = b.h + 40; els.scrW = b.w; els.scrH = b.h; els.cssW = 1440; els.scrOff = [0, 40]; }
  // chips
  els.chips = TL.chips.map((c, i) => { const d = document.createElement('div'); d.className = 'chip ' + c.kind; d.innerHTML = `<i></i>${c.text}`; d.style.left = L.chips[i][0] + 'px'; d.style.top = L.chips[i][1] + 'px'; $('chips').append(d); return d; });
  // titres, étiquettes, légendes
  els.heads = TL.heads.map(mkHead);
  els.labels = TL.labels.map(l => { const d = document.createElement('div'); d.className = 'lab'; d.textContent = l.text; d.style.left = L.label.x + 'px'; d.style.top = L.label.y + 'px'; $('txt').append(d); return { d, l }; });
  els.cap = document.createElement('div'); els.cap.className = 'cap'; els.cap.textContent = TL.caption_app; els.cap.style.left = L.cap.x + 'px'; els.cap.style.top = L.cap.y + 'px'; $('txt').append(els.cap);
  els.sub = mkHead({ text: TL.logo_sub }); Object.assign(els.sub.el.style, { left: L.sub.x + 'px', top: L.sub.y + 'px', fontSize: L.sub.size + 'px', color: '#fff', width: (W - 2 * L.sub.x) + 'px' });
  els.slo = mkHead({ text: TL.slogan }); Object.assign(els.slo.el.style, { left: L.cta.x + 'px', top: L.cta.sloY + 'px', fontSize: L.cta.sloSize + 'px', color: '#fff', width: (W - 2 * L.cta.x) + 'px' });
  els.btn = document.createElement('div'); els.btn.id = 'ctaBtn'; els.btn.innerHTML = `${TL.cta} <span>→</span><i id="shine" style="position:absolute;top:0;bottom:0;width:110px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.4),rgba(255,255,255,0))"></i>`;
  Object.assign(els.btn.style, { left: L.cta.x + 'px', top: L.cta.btnY + 'px', fontSize: (FMT === 'h' ? 38 : 42) + 'px', padding: FMT === 'h' ? '24px 40px' : '28px 44px' }); $('txt').append(els.btn);
  els.soon = document.createElement('div'); els.soon.className = 'lab'; els.soon.textContent = TL.soon; Object.assign(els.soon.style, { left: L.cta.x + 'px', top: L.cta.soonY + 'px', fontSize: (FMT === 'h' ? 30 : 32) + 'px', color: '#9CC3FF' }); $('txt').append(els.soon);
  els.cred = document.createElement('div'); els.cred.className = 'cap'; els.cred.textContent = TL.credits; Object.assign(els.cred.style, { left: L.cta.x + 'px', top: L.cta.credY + 'px', color: '#7f93ad', fontSize: '16px', width: (W - 2 * L.cta.x) + 'px' }); $('txt').append(els.cred);
  $('row').querySelector('.txt').textContent = TL.row_flood_orange;
  [...els.sub.accs, ...els.slo.accs].forEach(a => a.style.color = '#9CC3FF');
}
function mkCell() { const d = document.createElement('div'); d.className = 'cell'; const im = document.createElement('img'); d.append(im); $('cells').append(d); return { d, im }; }

// ======================= composants animés =======================
function headAnim(o, t, tin, tout, cut) {
  if (cut) { const vis = t >= tin - HALF && t < tout - HALF; op(o.el, vis ? 1 : 0); if (!vis) return;
    const p = spring(t - tin + HALF, 520, 34); o.ws.forEach(w => { w.style.transform = `translateY(${(1 - p) * 18}%) scale(${1 + (1 - p) * 0.08})`; }); return; }
  const vis = t >= tin - 0.02 && t < tout + (cut ? 0 : 0.42);
  op(o.el, vis ? 1 : 0); if (!vis) return;
  const ex = cut ? 0 : io(P(t, tout, tout + 0.32));
  o.ws.forEach((w, i) => { const p = UI(t, tin + i * 0.045); w.style.transform = `translateY(${(1 - p) * 112 - ex * 112}%) rotate(${(1 - p) * 5}deg)`; });
}
function cellOpen(c, t, t0, rect, mode) { // ouverture case par case (module snap)
  const [x, y, w, h] = rect; box(c.d, x, y, w, h);
  const cols = Math.max(1, Math.round(w / M)), rows = Math.max(1, Math.round(h / M));
  const p = mode === 'snap' ? steps(o5(P(t, t0, t0 + 0.42)), Math.max(cols, rows)) : 1;
  const cw = Math.max(M, Math.ceil(p * cols) * M), ch = Math.max(M, Math.ceil(p * rows) * M);
  const ix = Math.max(0, (w - cw) / 2), iy = Math.max(0, (h - ch) / 2);
  c.d.style.clipPath = p >= 1 ? 'none' : `inset(${iy}px ${ix}px ${iy}px ${ix}px)`;
}
function showClip(c, name, idx, shiftX = 0, blur = 0, scale = 1) {
  setSrc(c.im, fr(name, idx)); c.im.style.objectPosition = FOCUS[name];
  c.im.style.transform = `translateX(${shiftX}px) scale(${scale})`; c.im.style.filter = blur ? `blur(${blur}px)` : 'none';
}
function hide(...cs) { cs.forEach(c => op(c.d, 0)); }
// écran de l'appareil : capture réelle + cadrage (x, y en px CSS de la capture, zoom)

  build(); await document.fonts.ready; await Promise.all(['800 40px Inter', 'italic 40px Serif', '600 20px Mono'].map(f => document.fonts.load(f)));
  await window.seek(0); window.ready = true;
})();
// aperçu : Espace = lecture, ←/→ = image par image
let playing = false, t0 = 0, cur = 0;
addEventListener('keydown', e => { if (e.code === 'Space') { playing = !playing; t0 = performance.now() / 1000 - cur; if (playing) requestAnimationFrame(loop); } if (e.code === 'ArrowRight') seek(cur += 1 / 30); if (e.code === 'ArrowLeft') seek(cur -= 1 / 30); });
function loop() { if (!playing) return; cur = performance.now() / 1000 - t0; if (cur > TL.duration) { cur = 0; t0 = performance.now() / 1000; } seek(cur); requestAnimationFrame(loop); }
</script>
