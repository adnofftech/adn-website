    <g transform="translate(1080 250)"><circle r="42" fill="#15171a" stroke="#e89657" stroke-width="2.4"/><circle cy="-8" r="13" fill="none" stroke="#e89657" stroke-width="2.2"/><path d="M-19 26c0-13 8.6-20 19-20s19 7 19 20" fill="none" stroke="#e89657" stroke-width="2.2"/></g>
    <g transform="translate(420 470)"><circle r="42" fill="#15171a" stroke="#d06a96" stroke-width="2.4"/><circle cy="-8" r="13" fill="none" stroke="#d06a96" stroke-width="2.2"/><path d="M-19 26c0-13 8.6-20 19-20s19 7 19 20" fill="none" stroke="#d06a96" stroke-width="2.2"/></g>
    <g transform="translate(1180 470)"><circle r="42" fill="#15171a" stroke="#5d97c9" stroke-width="2.4"/><circle cy="-8" r="13" fill="none" stroke="#5d97c9" stroke-width="2.2"/><path d="M-19 26c0-13 8.6-20 19-20s19 7 19 20" fill="none" stroke="#5d97c9" stroke-width="2.2"/></g>
    <g transform="translate(560 680)"><circle r="42" fill="#15171a" stroke="#9277c9" stroke-width="2.4"/><circle cy="-8" r="13" fill="none" stroke="#9277c9" stroke-width="2.2"/><path d="M-19 26c0-13 8.6-20 19-20s19 7 19 20" fill="none" stroke="#9277c9" stroke-width="2.2"/></g>
