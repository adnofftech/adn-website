    <circle cx="800" cy="450" r="140" fill="none" stroke="#f5b800" stroke-opacity=".18" stroke-width="1.2" stroke-dasharray="7 11"/>
    <path d="M752 428h96l-12-26h-72z" fill="none" stroke="#f5b800" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M760 428v58h80v-58" fill="none" stroke="#f5b800" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M784 486v-28h32v28" fill="none" stroke="#f5b800" stroke-width="2.2"/>
  </g>

